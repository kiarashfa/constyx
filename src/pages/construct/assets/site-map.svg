<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="Consolas, 'Courier New', monospace">
  <style>
    .box { fill: #ffffff; stroke: #10201a; stroke-width: 1.5; }
    .name { fill: #10201a; font-size: 15px; letter-spacing: 2px; }
    .meta { fill: #47564f; font-size: 11px; }
    .live { fill: #067a3e; font-size: 11px; letter-spacing: 1px; }
    .wire { stroke: #8a978f; stroke-width: 1.2; fill: none; }
  </style>

  <rect class="box" x="255" y="24" width="250" height="62" />
  <text class="name" x="380" y="50" text-anchor="middle">[00] CONSOLE</text>
