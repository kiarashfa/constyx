  <path class="wire" d="M380 86 V120 M380 120 H130 M380 120 H630 M130 120 V160 M380 120 V160 M630 120 V160" />
  <path class="wire" d="M130 222 V250 M380 222 V250 M630 222 V250" />
  <path class="wire" d="M380 312 V340" />

  <rect class="box" x="20" y="160" width="220" height="62" />
  <text class="name" x="130" y="186" text-anchor="middle">[01] OPERATOR</text>
  <text class="live" x="130" y="206" text-anchor="middle">● LIVE · shift game</text>

