<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Consolas, 'Courier New', monospace">
  <style>
    .box { fill: #ffffff; stroke: #10201a; stroke-width: 1.5; }
    .pending { fill: #f2f5f3; stroke: #8a978f; stroke-dasharray: 5 4; }
    .name { fill: #10201a; font-size: 15px; letter-spacing: 2px; }
    .meta { fill: #47564f; font-size: 11px; }
    .live { fill: #067a3e; font-size: 11px; letter-spacing: 1px; }
    .pend { fill: #8a978f; font-size: 11px; letter-spacing: 1px; }
    .wire { stroke: #8a978f; stroke-width: 1.2; fill: none; }
  </style>

  <rect class="box" x="255" y="24" width="250" height="62" />
  <text class="name" x="380" y="50" text-anchor="middle">[00] CONSOLE</text>
  <text class="meta" x="380" y="70" text-anchor="middle">operator@nebuchadnezzar</text>

  <path class="wire" d="M380 86 V120 M380 120 H130 M380 120 H630 M130 120 V160 M380 120 V160 M630 120 V160" />
  <path class="wire" d="M130 222 V250 M380 222 V250 M630 222 V250" />

  <rect class="box" x="20" y="160" width="220" height="62" />
  <text class="name" x="130" y="186" text-anchor="middle">[01] OPERATOR</text>
  <text class="live" x="130" y="206" text-anchor="middle">● LIVE — shift game</text>

  <rect class="box" x="270" y="160" width="220" height="62" />
  <text class="name" x="380" y="186" text-anchor="middle">[02] CONSTRUCT</text>
  <text class="live" x="380" y="206" text-anchor="middle">● LIVE — you are here</text>

  <rect class="pending" x="520" y="160" width="220" height="62" />
  <text class="name" x="630" y="186" text-anchor="middle">[03] LOCATIONS</text>
  <text class="pend" x="630" y="206" text-anchor="middle">○ PENDING COMPILATION</text>

  <rect class="pending" x="20" y="250" width="220" height="62" />
  <text class="name" x="130" y="276" text-anchor="middle">[04] FOCUS</text>
  <text class="pend" x="130" y="296" text-anchor="middle">○ PENDING COMPILATION</text>

  <rect class="pending" x="270" y="250" width="220" height="62" />
  <text class="name" x="380" y="276" text-anchor="middle">[05] SCREENSAVER</text>
  <text class="pend" x="380" y="296" text-anchor="middle">○ PENDING COMPILATION</text>

  <rect class="pending" x="520" y="250" width="220" height="62" />
  <text class="name" x="630" y="276" text-anchor="middle">[06] ASCII</text>
  <text class="pend" x="630" y="296" text-anchor="middle">○ PENDING COMPILATION</text>

  <text class="meta" x="380" y="360" text-anchor="middle">signal topology :: six programs registered to this console</text>
</svg>
