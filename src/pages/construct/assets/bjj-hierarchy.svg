<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="Consolas, 'Courier New', monospace">
  <style>
    .name { fill: #10201a; font-size: 14px; letter-spacing: 1.5px; }
    .sub { fill: #47564f; font-size: 11.5px; }
    .axis { fill: #47564f; font-size: 11px; letter-spacing: 2px; }
    .pts { fill: #067a3e; font-size: 11.5px; }
    .rung { stroke: #8a978f; stroke-width: 1.2; }
  </style>

  <text class="axis" x="60" y="40">DOMINANT ▲</text>
  <rect x="70" y="52" width="10" height="360" fill="#067a3e" opacity="0.9" />
  <rect x="70" y="232" width="10" height="180" fill="#8a978f" opacity="0.55" />
  <rect x="70" y="322" width="10" height="90" fill="#b3402a" opacity="0.7" />
  <text class="axis" x="60" y="442">DEFENSIVE ▼</text>

  <line class="rung" x1="80" y1="70" x2="130" y2="70" />
  <text class="name" x="140" y="66">BACK CONTROL</text>
  <text class="pts" x="360" y="66">+4 pts</text>
  <text class="sub" x="140" y="83">chest to back, hooks in — they can't see you or hit you</text>

  <line class="rung" x1="80" y1="124" x2="130" y2="124" />
  <text class="name" x="140" y="120">MOUNT</text>
  <text class="pts" x="360" y="120">+4 pts</text>
  <text class="sub" x="140" y="137">seated on torso — gravity works for you</text>

  <line class="rung" x1="80" y1="178" x2="130" y2="178" />
  <text class="name" x="140" y="174">SIDE CONTROL / KNEE-ON-BELLY</text>
  <text class="pts" x="450" y="174">pass +3 / kob +2</text>
  <text class="sub" x="140" y="191">past the legs, chest pressure — the guard has been beaten</text>

  <line class="rung" x1="80" y1="232" x2="130" y2="232" />
  <text class="name" x="140" y="228">HALF GUARD</text>
  <text class="sub" x="140" y="245">one leg trapped — contested ground, both players have options</text>

  <line class="rung" x1="80" y1="286" x2="130" y2="286" />
  <text class="name" x="140" y="282">GUARD</text>
  <text class="pts" x="360" y="282">sweep +2</text>
  <text class="sub" x="140" y="299">on your back, legs between you and them — the great equalizer</text>

  <line class="rung" x1="80" y1="340" x2="130" y2="340" />
  <text class="name" x="140" y="336">TURTLE</text>
  <text class="sub" x="140" y="353">on all fours, elbows tight — surviving, exposed to back takes</text>

  <line class="rung" x1="80" y1="394" x2="130" y2="394" />
  <text class="name" x="140" y="390">FLATTENED OUT / BACK TAKEN</text>
  <text class="sub" x="140" y="407">where the choke lives — escape or tap</text>

  <text class="sub" x="360" y="448" text-anchor="middle">position before submission :: climb the ladder, never trade rungs for a maybe</text>
</svg>
